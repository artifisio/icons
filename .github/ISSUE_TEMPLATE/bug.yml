name: Bug report
description: Report a broken or incorrect icon
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue!
  - type: input
    id: set-slug
    attributes:
      label: Set slug
      description: "The slug of the affected set"
    validations:
      required: true
  - type: input
    id: asset-slug
    attributes:
      label: Asset slug
      description: The slug of the specific icon (if known)
  - type: textarea
    id: description
    attributes:
      label: What went wrong?
      placeholder: Describe the bug (broken file, wrong colours, missing variant, etc.)
    validations:
      required: true
